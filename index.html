<script>
const CATS=["Elétrica","Hidráulica","Civil","Ar-condicionado","Marcenaria","Pintura","Equipamentos","Outros"],PRI=["Baixa","Média","Alta","Urgente"],ST=["Aberto","Em análise","Aguardando aprovação","Aguardando material","Em execução","Concluído","Cancelado"];
const MENU=[["dash","Dashboard"],["novo","Abrir chamado"],["lista","Chamados de manutenção"],["mat","Materiais e estoque"],["rel","Relatórios"],["cfg","Configurações"]];
let db,user,assets,dl,T=[],M=[],CFG={Urgente:4,Alta:24,"Média":72,Baixa:120},view="dash",cur=null,F={},relT="hist",canAdm=false,uid="";
const $=s=>document.querySelector(s),R=n=>"R$ "+(+n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>t?new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—",now=()=>Date.now();
const mat$=t=>(t.materiais||[]).reduce((a,m)=>a+m.qtd*m.vu,0),cost=t=>mat$(t)+(+t.maoObra||0)+(+t.terceiros||0)+(+t.outros||0);
const lim=t=>t.abertura+(CFG[t.prioridade]||72)*36e5,done=t=>t.status=="Concluído"||t.status=="Cancelado";
function sla(t){const l=lim(t),end=t.conclusao||now(),tot=l-t.abertura;if(t.status=="Cancelado")return["n/a","gr"];if(end>l)return[t.conclusao?"Descumprido":"Vencido","er"];if(t.conclusao)return["Cumprido","ok"];return l-end<tot*.25?["Próximo do venc.","wn"]:["No prazo","ok"]}
const hm=ms=>{const s=ms<0?"-":"",h=Math.floor(Math.abs(ms)/36e5),m=Math.floor(Math.abs(ms)%36e5/6e4);return s+h+"h"+String(m).padStart(2,"0")};
const stc=s=>s=="Concluído"?"ok":s=="Cancelado"?"gr":s=="Aguardando aprovação"||s=="Aguardando material"?"wn":"bl";
const tag=(t,c)=>`<span class="t ${c}">${esc(t)}</span>`;
const mon=t=>new Date(t).toISOString().slice(0,7);
function grp(arr,f,v=()=>1){const o={};arr.forEach(x=>{const k=f(x);if(k!=null)o[k]=(o[k]||0)+v(x)});return o}
function bars(o,fmt=x=>x,sort=true){let e=Object.entries(o);if(sort)e.sort((a,b)=>b[1]-a[1]);e=e.slice(0,10);const mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div class="bar"><em title="${esc(k)}">${esc(k)}</em><i style="width:${v/mx*55}%"></i>${fmt(v)}</div>`).join(""):'<span class="mu">Sem dados ainda.</span>'}
let P=[],perfil={};
const SUPABASE_URL="https://moerpgbqjnersqwqgndw.supabase.co",SUPABASE_KEY="sb_publishable_Ob-2TxX1RnugHYew6kM0ow_PUJiT4XX";
let modo="entrar";
function msgErro(e){const m=(e.message||"").toLowerCase();
 if(m.includes("invalid login"))return"E-mail ou senha incorretos.";
 if(m.includes("already registered"))return"Este e-mail já tem cadastro. Use a opção Entrar.";
 if(m.includes("at least"))return"A senha precisa ter pelo menos 6 caracteres.";
 if(m.includes("rate limit"))return"Muitos cadastros em pouco tempo. Aguarde alguns minutos e tente de novo.";
 if(m.includes("not confirmed"))return"Confirme seu e-mail pelo link que enviamos antes de entrar.";
 if(m.includes("fetch"))return"Não foi possível conectar ao servidor. Verifique a internet.";
 return e.message||"Erro inesperado."}
function loginUI(){const c=modo=="criar";$("#nav").innerHTML="";
 $("#main").innerHTML=`<div class="login"><aside><h1>Manutenção Predial</h1><p>Chamados, prazos e custos de manutenção da unidade em um só lugar.</p></aside><form class="lf" onsubmit="enviar();return false"><h2>${c?"Criar conta":"Entrar"}</h2>${c?'<label>Nome<input id="l_n" autocomplete="name"></label>':""}<label>E-mail<input id="l_e" type="email" autocomplete="email"></label><label>Senha<input id="l_s" type="password" autocomplete="${c?"new-password":"current-password"}"></label><p class="er2" id="l_er"></p><button class="b" style="width:100%">${c?"Cadastrar":"Entrar"}</button><p class="mu" style="margin-top:14px">${c?"Já tem conta?":"Primeiro acesso?"} <a class="lk" onclick="modo='${c?"entrar":"criar"}';loginUI()">${c?"Entrar":"Criar conta"}</a></p></form></div>`}
async function enviar(){const e=$("#l_e").value.trim(),s=$("#l_s").value,er=$("#l_er");er.style.color="";er.textContent="";
 if(!e||!s){er.textContent="Informe e-mail e senha.";return}
 try{if(modo=="criar"){const n=$("#l_n").value.trim();if(!n){er.textContent="Informe seu nome.";return}
   const{data,error}=await SB.auth.signUp({email:e,password:s,options:{data:{nome:n}}});if(error)throw error;
   if(data.session)location.reload();else{er.style.color="var(--ok)";er.textContent="Cadastro feito. Enviamos um link de confirmação para o seu e-mail."}}
  else{const{error}=await SB.auth.signInWithPassword({email:e,password:s});if(error)throw error;location.reload()}}
 catch(x){er.textContent=msgErro(x)}}
async function init(){
 if(typeof supabase=="undefined")throw new Error("A biblioteca do Supabase não carregou (internet ou bloqueio do CDN).");
 window.SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const{data:{session}}=await SB.auth.getSession();if(!session){loginUI();return}
 uid=session.user.id;
 const pf=await SB.from("perfis").select("id,nome,papel");if(pf.error)throw new Error("Banco: "+pf.error.message+" — confirme que o schema.sql foi executado.");P=pf.data||[];perfil=P.find(p=>p.id==uid)||{nome:session.user.email,papel:"solicitante"};
 canAdm=["admin","gestor"].includes(perfil.papel);
 user={id:async()=>uid,me:async()=>({name:perfil.nome})};
 assets={upload:async f=>{const p=uid+"/"+Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_"),{error}=await SB.storage.from("fotos").upload(p,f);if(error)throw error;return{url:SB.storage.from("fotos").getPublicUrl(p).data.publicUrl}}};
 dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=filename;a.click()}};
 const cache={chamados:{},materiais:{},config:{}};
 const row=(t,o,id)=>t=="chamados"?{id,num:o.num,status:o.status,prioridade:o.prioridade,categoria:o.categoria,abertura:o.abertura,solicitante_id:o.solicitanteId||null,resp_id:o.respId||null,doc:o,updated_at:new Date().toISOString()}:{id,doc:o};
 const snap=t=>({docs:Object.keys(cache[t]).map(id=>({id,data:()=>cache[t][id]}))});
 db={collection:t=>({onSnapshot(cb){const f=async()=>{const{data}=await SB.from(t).select("id,doc");cache[t]={};(data||[]).forEach(r=>cache[t][r.id]=r.doc);cb(snap(t))};f();SB.channel(t).on("postgres_changes",{event:"*",schema:"public",table:t},f).subscribe()}}),
  doc:p=>{const[t,id]=p.split("/");return{
   async set(o){cache[t][id]=o;const{error}=await SB.from(t).upsert(row(t,o,id));if(error)throw error},
   async update(patch){const o={...(cache[t][id]||{}),...patch},r=row(t,o,id);delete r.id;const{data,error}=await SB.from(t).update(r).eq("id",id).select("id");if(error)throw error;if(!data.length)throw new Error("Sem permissão para alterar este registro");cache[t][id]=o},
   onSnapshot(cb){const f=async()=>{const{data}=await SB.from("config").select("id,doc").eq("id",id);const d=(data||[])[0]?.doc;cb({exists:!!d,data:()=>d||{}})};f();SB.channel("cfg").on("postgres_changes",{event:"*",schema:"public",table:"config"},f).subscribe()}}}};
 db.collection("chamados").onSnapshot(s=>{T=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 db.collection("materiais").onSnapshot(s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));if(view=="mat"||view=="det")render()});
 db.doc("config/sla").onSnapshot(s=>{if(s.exists)CFG={...CFG,...s.data()};render()});
 render()}
function mine(){return canAdm?T:T.filter(t=>t.solicitanteId==uid||t.respId==uid)}
function render(){if(!db)return;$("#nav").innerHTML=`<h1>Manutenção Predial</h1><div class="who"><b>${esc(perfil.nome)}</b>${{admin:"Administrador",gestor:"Gestor",tecnico:"Técnico",solicitante:"Solicitante"}[perfil.papel]||""} · <a onclick="SB.auth.signOut().then(()=>location.reload())">Sair</a></div>`+MENU.filter(m=>canAdm||!["mat","rel","cfg"].includes(m[0])).map(m=>`<button class="${view==m[0]||(view=="det"&&m[0]=="lista")?"on":""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("");
 ({dash,novo,lista,mat,rel,cfg,det})[view]()}
function go(v,id){view=v;cur=id||null;render();scrollTo(0,0)}
function dash(){const L=mine(),y=new Date().getFullYear(),m=mon(now()),ab=L.filter(t=>!done(t)),sl=L.filter(t=>t.status=="Concluído"),ok=sl.filter(t=>!t.conclusao||t.conclusao<=lim(t)).length;
 const K=[["Chamados abertos",ab.length],["Em andamento",L.filter(t=>t.status=="Em execução"||t.status=="Em análise").length],["Concluídos",sl.length],["Atrasados",ab.filter(t=>now()>lim(t)).length],["Aguardando aprovação",L.filter(t=>t.status=="Aguardando aprovação").length],["Custo no mês",R(L.filter(t=>mon(t.abertura)==m).reduce((a,t)=>a+cost(t),0))],["Custo no ano",R(L.filter(t=>new Date(t.abertura).getFullYear()==y).reduce((a,t)=>a+cost(t),0))],["SLA cumprido",sl.length?Math.round(ok/sl.length*100)+"%":"—"]];
 const mats=grp(L.flatMap(t=>t.materiais||[]),x=>x.nome,x=>x.qtd);
 const slaM={};sl.forEach(t=>{const k=mon(t.conclusao||t.abertura);(slaM[k]=slaM[k]||[0,0])[1]++;if(!t.conclusao||t.conclusao<=lim(t))slaM[k][0]++});
 const slaP=Object.fromEntries(Object.entries(slaM).sort().map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]));
 const C=[["Chamados por status",bars(grp(L,t=>t.status))],["Por categoria",bars(grp(L,t=>t.categoria))],["Custos por mês",bars(grp(L,t=>mon(t.abertura),cost),R,false)],["Custos por tipo de serviço",bars({Materiais:L.reduce((a,t)=>a+mat$(t),0),"Mão de obra":L.reduce((a,t)=>a+(+t.maoObra||0),0),Terceirizados:L.reduce((a,t)=>a+(+t.terceiros||0),0),Outros:L.reduce((a,t)=>a+(+t.outros||0),0)},R)],["Materiais mais utilizados",bars(mats)],["Chamados por localização",bars(grp(L,t=>t.local))],["Evolução do SLA (% cumprido)",bars(slaP,x=>x+"%",false)]];
 $("#main").innerHTML=`<h2>Dashboard</h2><div class="g">${K.map(k=>`<div class="c k"><span>${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div><div class="g g2">${C.map(c=>`<div class="c"><h3>${c[0]}</h3>${c[1]}</div>`).join("")}</div><div class="c"><h3>Chamados recentes</h3>${tbl([...L].sort((a,b)=>b.abertura-a.abertura).slice(0,8))}</div>`}
function tbl(L){return `<div class="tw"><table><tr><th>Nº</th><th>Local</th><th>Descrição</th><th>Responsável</th><th>Abertura</th><th>Prazo</th><th>SLA</th><th>Status</th><th>Custo</th></tr>${L.map(t=>{const s=sla(t);return`<tr class="cl" onclick="go('det','${t.id}')"><td>#${t.num}</td><td>${esc(t.local)}</td><td>${esc((t.descricao||"").slice(0,40))}</td><td>${esc(t.resp)}</td><td>${fd(t.abertura)}</td><td>${fd(lim(t))}</td><td>${tag(s[0],s[1])}</td><td>${tag(t.status,stc(t.status))}</td><td>${R(cost(t))}</td></tr>`}).join("")||'<tr><td colspan="9" class="mu">Nenhum chamado.</td></tr>'}</table></div>`}
let pend=[];
function novo(){pend=[];const n=Math.max(0,...T.map(t=>t.num||0))+1,dt=new Date(now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 $("#main").innerHTML=`<h2>Abrir chamado</h2><div class="c"><div class="f"><label>Nº do chamado<input value="#${n}" disabled></label><label>Unidade *<input id="n_un"></label><label>Localização (bloco, andar, sala) *<input id="n_lo"></label>
 <label>Categoria *<select id="n_ca">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Prioridade *<select id="n_pr">${PRI.map(c=>`<option ${c=="Média"?"selected":""}>${c}</option>`).join("")}</select></label><label>Data e hora *<input id="n_dt" type="datetime-local" value="${dt}"></label>
 <label>Solicitante *<input id="n_so"></label><label>Responsável pela execução *<select id="n_re"><option value="">Selecione…</option>${P.filter(p=>p.papel!="solicitante").map(p=>`<option value="${p.id}">${esc(p.nome)} (${p.papel})</option>`).join("")}</select></label></div>
 <label>Descrição detalhada do problema *<textarea id="n_de" rows="4"></textarea></label><label>Fotos do local<input type="file" id="n_ph" accept="image/*" multiple onchange="up(this,'n_pv')"></label><div class="ph" id="n_pv"></div><label>Observações<textarea id="n_ob" rows="2"></textarea></label>
 <p class="er2" id="n_er"></p><button class="b" onclick="salvar(${n})">Registrar chamado</button></div>`}
async function up(inp,pv){if(!assets){$("#"+pv).innerHTML='<span class="mu">Upload de fotos disponível apenas para editores.</span>';return}
 for(const f of inp.files){try{const r=await assets.upload(f);pend.push(r.url)}catch(e){alert("Falha no upload: "+(e.message||e.code))}}inp.value="";$("#"+pv).innerHTML=pend.map(u=>`<img src="${u}">`).join("")}
async function salvar(n){const v=i=>$("#"+i).value.trim(),d={unidade:v("n_un"),local:v("n_lo"),categoria:v("n_ca"),prioridade:v("n_pr"),solicitante:v("n_so"),resp:$("#n_re").selectedOptions[0]?.text.replace(/ \(\w+\)$/,"")||"",descricao:v("n_de")};
 if(Object.values(d).some(x=>!x)||!v("n_dt")||!v("n_re")){$("#n_er").textContent="Preencha todos os campos obrigatórios (*).";return}
 const id="c"+now(),t={...d,num:n,abertura:new Date(v("n_dt")).getTime(),obs:v("n_ob"),status:"Aberto",fotos:pend,solicitanteId:uid,respId:v("n_re"),materiais:[],maoObra:0,terceiros:0,outros:0,hist:[{t:now(),u:"Sistema",a:"Chamado aberto"}],coment:[]};
 try{await db.doc("chamados/"+id).set(t);go("det",id)}catch(e){$("#n_er").textContent="Erro ao salvar: "+(e.message||e.code)}}
function lista(){const o=(k,a)=>`<label>${k}<select onchange="F.${k}=this.value;lt()"><option value="">Todos</option>${a.map(x=>`<option ${F[k]==x?"selected":""}>${x}</option>`).join("")}</select></label>`;
 $("#main").innerHTML=`<h2>Chamados de manutenção</h2><div class="c np"><div class="f"><label>Número<input value="${F.num||""}" oninput="F.num=this.value;lt()"></label><label>Unidade<input value="${F.un||""}" oninput="F.un=this.value;lt()"></label><label>Localização<input value="${F.lo||""}" oninput="F.lo=this.value;lt()"></label><label>Responsável<input value="${F.re||""}" oninput="F.re=this.value;lt()"></label>${o("Categoria",CATS)}${o("Prioridade",PRI)}${o("Status",ST)}${o("SLA",["No prazo","Próximo do venc.","Vencido","Cumprido","Descumprido"])}<label>De<input type="date" value="${F.de||""}" onchange="F.de=this.value;lt()"></label><label>Até<input type="date" value="${F.ate||""}" onchange="F.ate=this.value;lt()"></label></div></div><div class="c" id="lt"></div>`;lt()}
function filt(L){return L.filter(t=>(!F.num||String(t.num).includes(F.num.replace("#","")))&&(!F.un||(t.unidade||"").toLowerCase().includes(F.un.toLowerCase()))&&(!F.lo||(t.local||"").toLowerCase().includes(F.lo.toLowerCase()))&&(!F.re||(t.resp||"").toLowerCase().includes(F.re.toLowerCase()))&&(!F.Categoria||t.categoria==F.Categoria)&&(!F.Prioridade||t.prioridade==F.Prioridade)&&(!F.Status||t.status==F.Status)&&(!F.SLA||sla(t)[0]==F.SLA)&&(!F.de||t.abertura>=new Date(F.de).getTime())&&(!F.ate||t.abertura<=new Date(F.ate).getTime()+864e5))}
function lt(){$("#lt").innerHTML=tbl(filt(mine()).sort((a,b)=>b.num-a.num))}
function det(){const t=T.find(x=>x.id==cur);if(!t){$("#main").innerHTML='<button class="b s" onclick="go(\'lista\')">← Voltar</button><p>Chamado não encontrado.</p>';return}
 const s=sla(t),end=t.conclusao||now(),fin=done(t),tec=canAdm||t.respId==uid,locked=fin&&!canAdm;
 const ph=(a)=>`<div class="ph">${(a||[]).map(u=>`<a href="${u}" target="_blank"><img src="${u}"></a>`).join("")||'<span class="mu">Sem fotos.</span>'}</div>`;
 $("#main").innerHTML=`<button class="b s np" onclick="go('lista')">← Voltar</button><h2 style="margin-top:12px">Chamado #${t.num} ${tag(t.status,stc(t.status))} ${tag("SLA: "+s[0],s[1])}</h2>
 <div class="g g2"><div class="c"><h3>Dados</h3><p>${esc(t.unidade)} · ${esc(t.local)}<br>${t.categoria} · Prioridade <b>${t.prioridade}</b><br>Solicitante: ${esc(t.solicitante)} · Responsável: ${esc(t.resp)}</p><p>${esc(t.descricao)}</p>${t.obs?`<p class="mu">Obs.: ${esc(t.obs)}</p>`:""}<h3>Fotos</h3>${ph(t.fotos)}</div>
 <div class="c"><h3>SLA</h3><p>Aberto em ${fd(t.abertura)}<br>Data limite: <b>${fd(lim(t))}</b><br>Tempo decorrido: ${hm(end-t.abertura)}<br>${t.conclusao?`Atendimento total: <b>${hm(t.conclusao-t.abertura)}</b>`:`Tempo restante: <b class="${lim(t)<now()?"er2":""}">${hm(lim(t)-now())}</b>`}</p>
 ${!locked&&tec?`<label>Atualizar status<select onchange="setSt(this.value)">${ST.filter(x=>x!="Concluído").map(x=>`<option ${x==t.status?"selected":""}>${x}</option>`).join("")}${t.status=="Concluído"?"<option selected>Concluído</option>":""}</select></label>`:""}</div></div>
 <div class="c"><h3>Materiais e Custos</h3><div class="tw"><table><tr><th>Material</th><th>Cód.</th><th>Qtd</th><th>Un.</th><th>Valor unit.</th><th>Total</th><th></th></tr>${(t.materiais||[]).map((m,i)=>`<tr><td>${esc(m.nome)}</td><td>${esc(m.cod)}</td><td>${m.qtd}</td><td>${esc(m.un)}</td><td>${R(m.vu)}</td><td>${R(m.qtd*m.vu)}</td><td>${locked?"":`<button class="b s" onclick="rmMat(${i})">✕</button>`}</td></tr>`).join("")||'<tr><td colspan="7" class="mu">Nenhum material.</td></tr>'}</table></div>
 ${locked||!tec?"":`<div class="row np"><select id="dm_s" onchange="pf()" style="flex:2"><option value="">Material do cadastro…</option>${M.map(m=>`<option value="${m.id}">${esc(m.nome)} (${m.estoque} ${esc(m.un)})</option>`).join("")}<option value="_">Avulso (digitar)</option></select><input id="dm_n" placeholder="Nome" style="flex:2"><input id="dm_q" type="number" min="0" step="any" placeholder="Qtd" style="flex:1"><input id="dm_u" placeholder="Un." style="flex:1"><input id="dm_v" type="number" min="0" step="any" placeholder="Valor unit." style="flex:1"><button class="b" onclick="addMat()">Adicionar</button></div>`}
 <div class="f"><label>Mão de obra (R$)<input type="number" min="0" step="any" value="${t.maoObra||0}" ${locked||!tec?"disabled":""} onchange="setC('maoObra',this.value)"></label><label>Terceirizados (R$)<input type="number" min="0" step="any" value="${t.terceiros||0}" ${locked||!tec?"disabled":""} onchange="setC('terceiros',this.value)"></label><label>Outros custos (R$)<input type="number" min="0" step="any" value="${t.outros||0}" ${locked||!tec?"disabled":""} onchange="setC('outros',this.value)"></label><label>Obs. financeiras<input value="${esc(t.obsFin)}" ${locked||!tec?"disabled":""} onchange="setC('obsFin',this.value,1)"></label></div>
 <p>Materiais ${R(mat$(t))} · <b>Custo total do serviço: ${R(cost(t))}</b></p></div>
 ${t.status=="Concluído"?`<div class="c"><h3>Conclusão</h3><p>${esc(t.descExec)}<br><span class="mu">Concluído em ${fd(t.conclusao)} · ${esc(t.obsFinais)}</span></p><div class="g g2"><div><b>Antes</b>${ph(t.antes)}</div><div><b>Depois</b>${ph(t.depois)}</div></div></div>`:t.status=="Cancelado"||!tec?"":`<div class="c np"><h3>Concluir chamado</h3><label>Descrição do serviço executado *<textarea id="cc_d" rows="3"></textarea></label><div class="f"><label>Data e hora da conclusão<input id="cc_t" type="datetime-local" value="${new Date(now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"></label><label>Fotos antes<input type="file" accept="image/*" multiple onchange="up(this,'cc_a')"></label><label>Fotos depois<input type="file" accept="image/*" multiple onchange="up2(this)"></label></div><div class="ph" id="cc_a"></div><label>Observações finais<input id="cc_o"></label><p class="er2" id="cc_e"></p><button class="b" style="background:var(--ok)" onclick="concluir()">Concluir chamado</button></div>`}
 <div class="g g2"><div class="c"><h3>Comentários</h3>${(t.coment||[]).map(c=>`<p><b>${esc(c.u)}</b> <span class="mu">${fd(c.t)}</span><br>${esc(c.x)}</p>`).join("")}<div class="row np"><input id="cm" placeholder="Novo comentário"><button class="b" onclick="coment()">Enviar</button></div><label class="np">Anexar fotos<input type="file" accept="image/*" multiple onchange="upFoto(this)"></label></div>
 <div class="c"><h3>Histórico de alterações</h3>${[...(t.hist||[])].reverse().map(h=>`<p class="mu">${fd(h.t)} · ${esc(h.u)}: ${esc(h.a)}</p>`).join("")}</div></div>`}
let pend2=[];
async function up2(inp){if(!assets)return;for(const f of inp.files){try{pend2.push((await assets.upload(f)).url)}catch(e){alert("Falha no upload")}}inp.value="";$("#cc_a").innerHTML+=pend2.map(u=>`<img src="${u}">`).join("")}
async function me(){try{return(await user.me()).name||"Usuário"}catch(e){return"Usuário"}}
async function upd(patch,acao){const t=T.find(x=>x.id==cur);const h=[...(t.hist||[]),{t:now(),u:await me(),a:acao}];try{await db.doc("chamados/"+cur).update({...patch,hist:h})}catch(e){alert("Sem permissão ou erro: "+(e.message||e.code))}}
const setSt=v=>upd({status:v},"Status alterado para "+v),setC=(k,v,s)=>upd({[k]:s?v:Math.max(0,+v||0)},"Campo "+k+" atualizado");
async function coment(){const x=$("#cm").value.trim();if(!x)return;const t=T.find(y=>y.id==cur);const u=await me();await db.doc("chamados/"+cur).update({coment:[...(t.coment||[]),{t:now(),u,x}],hist:[...(t.hist||[]),{t:now(),u,a:"Comentário adicionado"}]})}
async function upFoto(inp){if(!assets){alert("Upload disponível apenas para editores.");return}const t=T.find(y=>y.id==cur),n=[];for(const f of inp.files){try{n.push((await assets.upload(f)).url)}catch(e){}}inp.value="";if(n.length)upd({fotos:[...(t.fotos||[]),...n]},n.length+" foto(s) anexada(s)")}
function pf(){const m=M.find(x=>x.id==$("#dm_s").value);if(m){$("#dm_n").value=m.nome;$("#dm_u").value=m.un;$("#dm_v").value=m.vu}}
async function addMat(){const t=T.find(x=>x.id==cur),sid=$("#dm_s").value,m=M.find(x=>x.id==sid),q=+$("#dm_q").value,vu=+$("#dm_v").value,nome=$("#dm_n").value.trim();if(!nome||!(q>0)||!(vu>=0)||!$("#dm_u").value.trim()){alert("Informe nome, quantidade, unidade e valor unitário.");return}
 await upd({materiais:[...(t.materiais||[]),{nome,cod:m?.cod||"",qtd:q,un:$("#dm_u").value.trim(),vu,mid:m?.id||null}]},"Material adicionado: "+nome+" ("+q+")");if(m&&canAdm)db.doc("materiais/"+m.id).update({estoque:Math.max(0,m.estoque-q)}).catch(()=>{})}
async function rmMat(i){const t=T.find(x=>x.id==cur),m=t.materiais[i],c=M.find(x=>x.id==m.mid);await upd({materiais:t.materiais.filter((_,j)=>j!=i)},"Material removido: "+m.nome);if(c&&canAdm)db.doc("materiais/"+c.id).update({estoque:c.estoque+m.qtd}).catch(()=>{})}
async function concluir(){const d=$("#cc_d").value.trim();if(!d){$("#cc_e").textContent="Não é possível concluir sem descrever o serviço executado.";return}
 const c=new Date($("#cc_t").value).getTime()||now(),t=T.find(x=>x.id==cur);await upd({status:"Concluído",conclusao:c,descExec:d,obsFinais:$("#cc_o").value,antes:pend,depois:pend2},"Chamado concluído em "+hm(c-t.abertura)+" — SLA "+(c<=lim(t)?"cumprido":"descumprido"));pend=[];pend2=[]}
function mat(){$("#main").innerHTML=`<h2>Materiais e estoque</h2><div class="c np"><div class="f"><label>Nome<input id="m_n"></label><label>Categoria<select id="m_c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Código<input id="m_k"></label><label>Unidade<input id="m_u"></label><label>Valor unitário<input id="m_v" type="number" min="0" step="any"></label><label>Estoque<input id="m_e" type="number" min="0" step="any"></label><label>Estoque mínimo<input id="m_m" type="number" min="0" step="any"></label></div><p class="er2" id="m_er"></p><button class="b" onclick="addM()">Cadastrar material</button></div>
 <div class="c tw"><table><tr><th>Nome</th><th>Cat.</th><th>Cód.</th><th>Un.</th><th>Valor unit.</th><th>Estoque</th><th>Mín.</th><th>Consumo</th><th></th></tr>${M.map(m=>{const cs=T.flatMap(t=>t.materiais||[]).filter(x=>x.mid==m.id).reduce((a,x)=>a+x.qtd,0);return`<tr><td>${esc(m.nome)}</td><td>${m.categoria}</td><td>${esc(m.cod)}</td><td>${esc(m.un)}</td><td><input style="width:90px" type="number" step="any" value="${m.vu}" onchange="pm('${m.id}','vu',this.value)"></td><td>${m.estoque<=m.min?tag(m.estoque,"er"):m.estoque}</td><td>${m.min}</td><td>${cs}</td><td><button class="b s" onclick="pm('${m.id}','estoque',+prompt('Novo estoque',${m.estoque})||0)">Ajustar</button></td></tr>`}).join("")||'<tr><td colspan="9" class="mu">Nenhum material.</td></tr>'}</table></div>`}
async function addM(){const v=i=>$("#"+i).value.trim(),d={nome:v("m_n"),categoria:v("m_c"),cod:v("m_k"),un:v("m_u")};if(!d.nome||!d.un||v("m_v")===""||v("m_e")===""){$("#m_er").textContent="Preencha nome, unidade, valor e estoque.";return}
 await db.doc("materiais/m"+now()).set({...d,vu:+v("m_v"),estoque:+v("m_e"),min:+v("m_m")||0});mat()}
const pm=(id,k,v)=>db.doc("materiais/"+id).update({[k]:Math.max(0,+v||0)});
function rel(){const L=filt0();const tp={hist:"Histórico de manutenções",mes:"Custo mensal",ano:"Custo anual",cons:"Consumo de materiais",pend:"Concluídos e pendentes",sla:"Chamados fora do SLA",loc:"Custo por localização",resp:"Desempenho por responsável"};
 let H,Rw;const G=(f,v)=>grp(L,f,v);
 if(relT=="hist"){H=["Nº","Data","Local","Categoria","Status","Responsável","Custo"];Rw=L.map(t=>[t.num,fd(t.abertura),t.local,t.categoria,t.status,t.resp,cost(t)])}
 else if(relT=="mes"||relT=="ano"||relT=="loc"){const o=G(t=>relT=="mes"?mon(t.abertura):relT=="ano"?new Date(t.abertura).getFullYear():t.local,cost);H=[relT=="loc"?"Local":"Período","Custo"];Rw=Object.entries(o).sort()}
 else if(relT=="cons"){const o=grp(L.flatMap(t=>t.materiais||[]),x=>x.nome,x=>x.qtd),v=grp(L.flatMap(t=>t.materiais||[]),x=>x.nome,x=>x.qtd*x.vu);H=["Material","Qtd","Custo"];Rw=Object.keys(o).map(k=>[k,o[k],v[k]])}
 else if(relT=="pend"){H=["Status","Chamados"];Rw=Object.entries(G(t=>done(t)?t.status:"Pendente"))}
 else if(relT=="sla"){H=["Nº","Local","Prioridade","Prazo","SLA"];Rw=L.filter(t=>["Vencido","Descumprido"].includes(sla(t)[0])).map(t=>[t.num,t.local,t.prioridade,fd(lim(t)),sla(t)[0]])}
 else{const rs=[...new Set(L.map(t=>t.resp))];H=["Responsável","Chamados","Concluídos","SLA cumprido","Custo"];Rw=rs.map(r=>{const x=L.filter(t=>t.resp==r),c=x.filter(t=>t.status=="Concluído"),o=c.filter(t=>t.conclusao<=lim(t)).length;return[r,x.length,c.length,c.length?Math.round(o/c.length*100)+"%":"—",x.reduce((a,t)=>a+cost(t),0)]})}
 window._rel={H,Rw};const fm=x=>typeof x=="number"&&/usto|Valor/.test(H[Rw[0]?.indexOf(x)]||"")?R(x):x;
 $("#main").innerHTML=`<h2>Relatórios</h2><div class="c np"><div class="f"><label>Relatório<select onchange="relT=this.value;rel()">${Object.entries(tp).map(([k,v])=>`<option value="${k}" ${k==relT?"selected":""}>${v}</option>`).join("")}</select></label><label>Categoria<select onchange="F.Categoria=this.value;rel()"><option value="">Todas</option>${CATS.map(c=>`<option ${F.Categoria==c?"selected":""}>${c}</option>`).join("")}</select></label><label>Localização<input value="${F.lo||""}" onchange="F.lo=this.value;rel()"></label><label>Status<select onchange="F.Status=this.value;rel()"><option value="">Todos</option>${ST.map(c=>`<option ${F.Status==c?"selected":""}>${c}</option>`).join("")}</select></label><label>De<input type="date" value="${F.de||""}" onchange="F.de=this.value;rel()"></label><label>Até<input type="date" value="${F.ate||""}" onchange="F.ate=this.value;rel()"></label></div><div class="row"><button class="b" onclick="expCsv()">Exportar Excel (CSV)</button><button class="b s" onclick="print()">Exportar PDF (imprimir)</button></div></div>
 <div class="c tw"><h3>${tp[relT]}</h3><table><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr>${Rw.map(r=>`<tr>${r.map((x,i)=>`<td>${/usto/.test(H[i])&&typeof x=="number"?R(x):esc(x)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${H.length}" class="mu">Sem dados.</td></tr>`}</table></div>`}
const filt0=()=>filt(T);
async function expCsv(){const{H,Rw}=window._rel,csv="\ufeff"+[H,...Rw].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");if(!dl){alert("Download indisponível nesta visualização.");return}try{await dl.save({filename:"relatorio-"+relT+".csv",data:csv})}catch(e){}}
function cfg(){$("#main").innerHTML=`<h2>Configurações</h2><div class="c"><h3>Prazos de SLA (horas corridas)</h3><div class="f">${PRI.slice().reverse().map(p=>`<label>${p}<input type="number" min="1" id="s_${p}" value="${CFG[p]}" ${canAdm?"":"disabled"}></label>`).join("")}</div><button class="b" onclick="saveCfg()">Salvar prazos</button><p class="mu">SLA em tempo corrido; dias e horários úteis poderão ser configurados no futuro. Administradores e gestores são os usuários com permissão de edição neste artefato; demais usuários só veem e acompanham os próprios chamados.</p></div>`}
async function saveCfg(){const o={};PRI.forEach(p=>o[p]=Math.max(1,+$("#s_"+p).value||CFG[p]));try{await db.doc("config/sla").set(o);alert("Prazos salvos.")}catch(e){alert("Sem permissão.")}}
window.addEventListener("unhandledrejection",e=>{$("#main").innerHTML='<div class="c er2"><b>Erro:</b> '+esc(e.reason&&e.reason.message||e.reason)+"</div>"});
window.addEventListener("error",e=>{$("#main").innerHTML='<div class="c er2"><b>Erro:</b> '+esc(e.message)+"</div>"});
init();
</script></body></html>
